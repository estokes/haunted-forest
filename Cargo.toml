[package]
name = "haunted-forest"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = "s"
lto = "thin"

[dependencies]
anyhow = "1"
arcstr = { version = "1", features = ["serde"] }
bevy = "0.18.0"
crossbeam-channel = "0.5"
enumflags2 = "0.7"
futures = "0.3"
fxhash = "0.2"
log = "0.4"
poolshark = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

# netidx — path deps must match graphix's workspace to ensure type identity
netidx = { version = "0.31", default-features = false, path = "../netidx/netidx" }
netidx-core = { version = "0.31", path = "../netidx/netidx-core" }
netidx-protocols = { version = "0.31", path = "../netidx/netidx-protocols" }
netidx-value = { version = "0.31", path = "../netidx/netidx-value" }

# graphix
graphix-compiler = { version = "0.5.0", path = "../graphix/graphix-compiler" }
graphix-rt = { version = "0.5.0", path = "../graphix/graphix-rt" }
graphix-package = { version = "0.5.0", path = "../graphix/graphix-package" }
graphix-package-core = { version = "0.5.0", path = "../graphix/stdlib/graphix-package-core" }
graphix-package-array = { version = "0.5.0", path = "../graphix/stdlib/graphix-package-array" }
graphix-package-str = { version = "0.5.0", path = "../graphix/stdlib/graphix-package-str" }
graphix-package-map = { version = "0.5.0", path = "../graphix/stdlib/graphix-package-map" }
graphix-package-time = { version = "0.5.0", path = "../graphix/stdlib/graphix-package-time" }
graphix-package-net = { version = "0.5.0", path = "../graphix/stdlib/graphix-package-net" }
graphix-package-gui = { version = "0.5.0", path = "../graphix/stdlib/graphix-package-gui" }

# iced (versions must match graphix-package-gui to ensure type identity)
arboard = "3"
iced_core = "0.14"
iced_renderer = { version = "0.14", features = ["wgpu", "wgpu-bare"] }
iced_runtime = "0.14"
iced_wgpu = "0.14"
iced_widget = "0.14"
winit = { version = "0.30", features = ["rwh_06"] }
