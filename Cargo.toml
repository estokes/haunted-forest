[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = "s"
lto = "thin"

[workspace.dependencies]
anyhow = "1"
arcstr = { version = "1", features = ["serde"] }
bevy = "0.18.0"
crossbeam-channel = "0.5"
enumflags2 = "0.7"
futures = "0.3"
fxhash = "0.2"
log = "0.4"
poolshark = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

# netidx — path deps must match graphix's workspace to ensure type identity
netidx = { version = "0.31", default-features = false, path = "../netidx/netidx" }
netidx-core = { version = "0.31", path = "../netidx/netidx-core" }
netidx-protocols = { version = "0.31", path = "../netidx/netidx-protocols" }
netidx-value = { version = "0.31", path = "../netidx/netidx-value" }

# graphix
graphix-compiler = { version = "0.7.0", path = "../graphix/graphix-compiler" }
graphix-rt = { version = "0.7.0", path = "../graphix/graphix-rt" }
graphix-package = { version = "0.7.0", path = "../graphix/graphix-package" }
graphix-package-core = { version = "0.7.0", path = "../graphix/stdlib/graphix-package-core" }
graphix-package-array = { version = "0.7.0", path = "../graphix/stdlib/graphix-package-array" }
graphix-package-str = { version = "0.7.0", path = "../graphix/stdlib/graphix-package-str" }
graphix-package-map = { version = "0.7.0", path = "../graphix/stdlib/graphix-package-map" }
graphix-package-sys = { version = "0.7.0", path = "../graphix/stdlib/graphix-package-sys" }
graphix-package-gui = { version = "0.7.0", path = "../graphix/stdlib/graphix-package-gui" }

# Burn ML framework — local checkout for development/PRs
# default-features = false avoids burn-cuda's fusion wrapper so Cuda = CubeBackend directly
burn = { path = "../burn/crates/burn", default-features = false, features = ["std", "cuda", "cubecl", "autotune", "autodiff"] }
burn-cubecl = { path = "../burn/crates/burn-cubecl", default-features = false, features = ["std"] }
burn-backend = { path = "../burn/crates/burn-backend" }
burn-std = { path = "../burn/crates/burn-std" }
cubecl = { path = "../cubecl/crates/cubecl", default-features = false, features = ["cuda"] }

# iced (versions must match graphix-package-gui to ensure type identity)
arboard = "3"
iced_core = "0.14"
iced_renderer = { version = "0.14", features = ["wgpu", "wgpu-bare"] }
iced_runtime = "0.14"
iced_wgpu = "0.14"
iced_widget = "0.14"
winit = { version = "0.30", features = ["rwh_06"] }

# utilities
half = "2"
memmap2 = "0.9"

# workspace crates
hf-llm = { path = "crates/hf-llm" }
hf-model = { path = "crates/hf-model" }

# Patch cubecl to use local checkout with u32→u64 overflow fix in memory allocator
[patch."https://github.com/tracel-ai/cubecl"]
cubecl = { path = "../cubecl/crates/cubecl" }
cubecl-common = { path = "../cubecl/crates/cubecl-common" }
cubecl-zspace = { path = "../cubecl/crates/cubecl-zspace" }
cubecl-core = { path = "../cubecl/crates/cubecl-core" }
cubecl-runtime = { path = "../cubecl/crates/cubecl-runtime" }
cubecl-cuda = { path = "../cubecl/crates/cubecl-cuda" }
cubecl-ir = { path = "../cubecl/crates/cubecl-ir" }
cubecl-opt = { path = "../cubecl/crates/cubecl-opt" }
cubecl-macros = { path = "../cubecl/crates/cubecl-macros" }
cubecl-std = { path = "../cubecl/crates/cubecl-std" }
cubecl-macros-internal = { path = "../cubecl/crates/cubecl-macros-internal" }
